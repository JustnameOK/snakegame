<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>贪吃游鱼</title>
    <style>
        /* ===== 重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #f5efe6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', monospace;
            padding: 12px;
        }

        /* ===== 容器 ===== */
        .game-container {
            background: #fcf8f0;
            border-radius: 24px;
            padding: 18px 20px 22px 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
            max-width: 540px;
            width: 100%;
            border: 1px solid rgba(255, 245, 230, 0.5);
            position: relative;
        }

        /* ===== 顶部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .score-label {
            color: #7f6e5c;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .score-value {
            color: #c29a4a;
            font-size: 28px;
            font-weight: 700;
            line-height: 1;
            min-width: 36px;
            text-align: right;
        }

        /* ===== 画布 ===== */
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            border-radius: 14px;
            background: #e8ddd0;
            box-shadow: inset 0 0 0 1px rgba(180, 150, 120, 0.15);
            image-rendering: pixelated;
            touch-action: none;
        }

        /* ===== 底部 ===== */
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 6px;
        }

        .status {
            color: #7f6e5c;
            font-size: 13px;
            font-weight: 500;
        }
        .status .highlight {
            color: #b8956a;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            background: transparent;
            border: 1px solid rgba(160, 130, 100, 0.20);
            color: #7f6e5c;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .btn:hover {
            background: rgba(160, 130, 100, 0.08);
            border-color: rgba(160, 130, 100, 0.35);
            color: #5a4a3a;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-pause {
            min-width: 60px;
        }
        .btn-restart {
            border-color: rgba(160, 130, 100, 0.20);
        }
        .btn-leaderboard {
            border-color: rgba(194, 154, 74, 0.30);
            color: #b8956a;
        }
        .btn-leaderboard:hover {
            background: rgba(194, 154, 74, 0.10);
            border-color: rgba(194, 154, 74, 0.50);
            color: #8a6d42;
        }

        /* ===== 控制模式切换 ===== */
        .mode-switch {
            display: flex;
            gap: 6px;
            background: rgba(200, 180, 160, 0.15);
            border-radius: 40px;
            padding: 4px;
            border: 1px solid rgba(160, 130, 100, 0.10);
        }

        .mode-btn {
            background: transparent;
            border: none;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            color: #7f6e5c;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }
        .mode-btn.active {
            background: #fcf8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: #4a3d32;
        }
        .mode-btn:active {
            transform: scale(0.92);
        }

        /* ===== 十字方向键 ===== */
        .touch-controls {
            display: flex;
            justify-content: center;
            margin-top: 18px;
        }

        .dpad {
            display: grid;
            grid-template-columns: 88px 88px 88px;
            grid-template-rows: 88px 88px 88px;
            gap: 8px;
            padding: 8px;
            background: rgba(200, 180, 160, 0.12);
            border-radius: 24px;
        }

        .dpad-up {
            grid-column: 2;
            grid-row: 1;
        }
        .dpad-left {
            grid-column: 1;
            grid-row: 2;
        }
        .dpad-right {
            grid-column: 3;
            grid-row: 2;
        }
        .dpad-down {
            grid-column: 2;
            grid-row: 3;
        }
        .dpad-center {
            grid-column: 2;
            grid-row: 2;
            background: transparent;
            pointer-events: none;
            border-radius: 50%;
            border: 1px solid rgba(160, 130, 100, 0.10);
        }

        .touch-btn {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background: rgba(200, 180, 160, 0.15);
            border: 1px solid rgba(160, 130, 100, 0.12);
            color: #6b5a48;
            font-size: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: none;
            transition: transform 0.05s, background 0.05s;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .touch-btn:active {
            transform: scale(0.78);
            background: rgba(200, 180, 160, 0.30);
            border-color: rgba(160, 130, 100, 0.30);
            color: #3d3228;
            box-shadow: inset 0 0 20px rgba(200, 180, 160, 0.20);
        }

        /* ===== 摇杆 ===== */
        .joystick-area {
            display: none;
            justify-content: center;
            margin-top: 18px;
        }

        .joystick-base {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: rgba(200, 180, 160, 0.20);
            border: 2px solid rgba(160, 130, 100, 0.20);
            position: relative;
            touch-action: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .joystick-thumb {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(200, 180, 160, 0.40);
            border: 1px solid rgba(160, 130, 100, 0.25);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            transition: transform 0.05s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .joystick-base:active .joystick-thumb {
            background: rgba(200, 180, 160, 0.60);
            border-color: rgba(160, 130, 100, 0.40);
        }

        /* ===== 高分榜模态框 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.2s ease;
        }
        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.94);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-card {
            background: #fcf8f0;
            border-radius: 24px;
            padding: 24px 28px 28px 28px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.20);
            border: 1px solid rgba(255, 245, 230, 0.5);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(200, 180, 160, 0.20);
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
            color: #4a3d32;
            letter-spacing: 1px;
        }
        .modal-title span {
            color: #c29a4a;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 28px;
            color: #7f6e5c;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
            transition: color 0.2s, transform 0.15s;
        }
        .modal-close:hover {
            color: #4a3d32;
        }
        .modal-close:active {
            transform: scale(0.85);
        }

        .modal-body {
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .modal-body::-webkit-scrollbar {
            width: 4px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: rgba(200, 180, 160, 0.10);
            border-radius: 8px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: rgba(200, 180, 160, 0.30);
            border-radius: 8px;
        }

        /* 高分榜列表 */
        .score-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .score-item {
            display: flex;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(200, 180, 160, 0.10);
            gap: 12px;
        }
        .score-item:last-child {
            border-bottom: none;
        }

        .score-rank {
            font-weight: 700;
            font-size: 16px;
            color: #7f6e5c;
            min-width: 32px;
            text-align: center;
        }
        .score-rank.top1 {
            color: #f5b832;
        }
        .score-rank.top2 {
            color: #b8a090;
        }
        .score-rank.top3 {
            color: #cd8d4a;
        }

        .score-value-item {
            font-weight: 700;
            font-size: 18px;
            color: #4a3d32;
            flex: 1;
        }

        .score-date {
            font-size: 12px;
            color: #9a8a7a;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            color: #9a8a7a;
            padding: 30px 0;
            font-size: 15px;
        }
        .empty-state .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 520px) {
            .game-container {
                padding: 14px 14px 18px 14px;
                border-radius: 18px;
            }
            .score-value {
                font-size: 24px;
            }
            .score-label {
                font-size: 12px;
            }

            .dpad {
                grid-template-columns: 72px 72px 72px;
                grid-template-rows: 72px 72px 72px;
                gap: 6px;
                padding: 6px;
                border-radius: 18px;
            }
            .touch-btn {
                font-size: 26px;
                border-radius: 14px;
            }

            .joystick-base {
                width: 150px;
                height: 150px;
            }
            .joystick-thumb {
                width: 58px;
                height: 58px;
            }

            .status {
                font-size: 12px;
            }
            .btn {
                font-size: 12px;
                padding: 3px 12px;
            }
            .mode-btn {
                font-size: 12px;
                padding: 3px 12px;
            }

            .modal-card {
                padding: 18px 18px 22px 18px;
                max-width: 360px;
            }
            .modal-title {
                font-size: 19px;
            }
            .score-value-item {
                font-size: 16px;
            }
            .score-rank {
                font-size: 14px;
                min-width: 26px;
            }
            .score-date {
                font-size: 11px;
            }
            .score-item {
                padding: 8px 4px;
                gap: 8px;
            }
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 10px 10px 14px 10px;
                border-radius: 14px;
            }
            .score-value {
                font-size: 20px;
            }
            .dpad {
                grid-template-columns: 60px 60px 60px;
                grid-template-rows: 60px 60px 60px;
                gap: 5px;
                padding: 4px;
                border-radius: 14px;
            }
            .touch-btn {
                font-size: 20px;
                border-radius: 12px;
            }
            .joystick-base {
                width: 120px;
                height: 120px;
            }
            .joystick-thumb {
                width: 46px;
                height: 46px;
            }
            .score-label {
                font-size: 11px;
            }
            .status {
                font-size: 11px;
            }
            .btn {
                font-size: 11px;
                padding: 2px 10px;
            }
            .mode-btn {
                font-size: 11px;
                padding: 2px 10px;
            }
            .modal-card {
                padding: 14px 14px 18px 14px;
                max-width: 300px;
            }
            .modal-title {
                font-size: 17px;
            }
            .score-value-item {
                font-size: 14px;
            }
            .score-rank {
                font-size: 12px;
                min-width: 22px;
            }
            .score-date {
                font-size: 10px;
            }
            .score-item {
                padding: 6px 2px;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">

        <!-- 顶部 -->
        <div class="header">
            <span class="score-label">分数</span>
            <span class="score-value" id="scoreDisplay">0</span>
        </div>

        <!-- 画布 -->
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <!-- 底部 -->
        <div class="footer">
            <span class="status" id="statusDisplay">
                <span class="highlight">▶</span> 方向键开始
            </span>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <div class="mode-switch" id="modeSwitch">
                    <button class="mode-btn active" data-mode="dpad">十字</button>
                    <button class="mode-btn" data-mode="joystick">摇杆</button>
                </div>
                <div class="btn-group">
                    <button class="btn btn-pause" id="pauseBtn">⏸ 暂停</button>
                    <button class="btn btn-leaderboard" id="leaderboardBtn">🏆 高分榜</button>
                    <button class="btn btn-restart" id="restartBtn">↻ 重来</button>
                </div>
            </div>
        </div>

        <!-- 十字方向键 -->
        <div class="touch-controls" id="dpadContainer">
            <div class="dpad">
                <button class="touch-btn dpad-up" data-dir="up">▲</button>
                <button class="touch-btn dpad-left" data-dir="left">◀</button>
                <button class="touch-btn dpad-right" data-dir="right">▶</button>
                <button class="touch-btn dpad-down" data-dir="down">▼</button>
                <div class="dpad-center"></div>
            </div>
        </div>

        <!-- 摇杆 -->
        <div class="joystick-area" id="joystickContainer">
            <div class="joystick-base" id="joystickBase">
                <div class="joystick-thumb" id="joystickThumb"></div>
            </div>
        </div>

        <!-- ===== 高分榜模态框 ===== -->
        <div class="modal-overlay" id="leaderboardModal">
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-title">🏆 <span>高分榜</span></div>
                    <button class="modal-close" id="modalCloseBtn">✕</button>
                </div>
                <div class="modal-body" id="leaderboardBody">
                    <!-- 由 JS 动态渲染 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  配置
            // ================================================================
            const BOARD_SIZE = 20;
            const CELL_SIZE = 500 / BOARD_SIZE;

            const BASE_INTERVAL = 280;
            const MIN_INTERVAL = 80;
            const SPEED_STEP = 3;

            const HIGH_SCORE_KEY = 'snake_high_scores';
            const MAX_SCORES = 10;

            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const statusDiv = document.getElementById('statusDisplay');

            // ================================================================
            //  DOM 引用
            // ================================================================
            const dpadContainer = document.getElementById('dpadContainer');
            const joystickContainer = document.getElementById('joystickContainer');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const joystickBase = document.getElementById('joystickBase');
            const joystickThumb = document.getElementById('joystickThumb');
            const pauseBtn = document.getElementById('pauseBtn');
            const leaderboardBtn = document.getElementById('leaderboardBtn');
            const leaderboardModal = document.getElementById('leaderboardModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const leaderboardBody = document.getElementById('leaderboardBody');

            // ================================================================
            //  游戏状态
            // ================================================================
            let snake = [];
            let food = { x: 8, y: 10 };
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let gameOver = false;
            let win = false;
            let gameLoopInterval = null;
            let isGameRunning = false;
            let currentInterval = BASE_INTERVAL;
            let currentMode = 'dpad';
            let isPaused = false;

            let joystickActive = false;
            let joystickDir = null;

            // ================================================================
            //  震动反馈
            // ================================================================
            function triggerHaptic() {
                if (navigator.vibrate) {
                    navigator.vibrate(8);
                }
            }

            // ================================================================
            //  高分榜 - 存储与读取
            // ================================================================
            function getHighScores() {
                try {
                    const data = localStorage.getItem(HIGH_SCORE_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (_) {
                    return [];
                }
            }

            function saveHighScore(newScore) {
                if (newScore <= 0) return false;

                let scores = getHighScores();

                // 添加新记录
                const now = new Date();
                const dateStr = now.getFullYear() + '-' +
                    String(now.getMonth() + 1).padStart(2, '0') + '-' +
                    String(now.getDate()).padStart(2, '0') + ' ' +
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0');
                scores.push({ score: newScore, date: dateStr });

                // 按分数降序排序
                scores.sort((a, b) => b.score - a.score);

                // 只保留前 N 条
                if (scores.length > MAX_SCORES) {
                    scores = scores.slice(0, MAX_SCORES);
                }

                localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(scores));
                return true;
            }

            function renderLeaderboard() {
                const scores = getHighScores();

                if (scores.length === 0) {
                    leaderboardBody.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">📭</span>
                            还没有记录<br/>快去挑战吧！
                        </div>
                    `;
                    return;
                }

                let html = '<ul class="score-list">';
                scores.forEach((item, index) => {
                    const rank = index + 1;
                    let rankClass = 'score-rank';
                    if (rank === 1) rankClass += ' top1';
                    else if (rank === 2) rankClass += ' top2';
                    else if (rank === 3) rankClass += ' top3';

                    const medal = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : '#' + rank;

                    html += `
                        <li class="score-item">
                            <span class="${rankClass}">${medal}</span>
                            <span class="score-value-item">${item.score}</span>
                            <span class="score-date">${item.date}</span>
                        </li>
                    `;
                });
                html += '</ul>';
                leaderboardBody.innerHTML = html;
            }

            // ================================================================
            //  模态框控制
            // ================================================================
            function openLeaderboard() {
                renderLeaderboard();
                leaderboardModal.classList.add('active');
                // 如果游戏正在运行，暂停游戏（但不改变暂停按钮状态，只是不让游戏继续移动）
                // 实际上我们不需要暂停游戏，模态框只是覆盖在界面上，游戏循环还在跑
                // 但为了更好的体验，我们可以让游戏在模态框打开时暂停
                if (!gameOver && isGameRunning && !isPaused) {
                    // 自动暂停
                    isPaused = true;
                    pauseBtn.textContent = '▶ 继续';
                    setStatus('⏸ 暂停');
                    drawCanvas();
                }
            }

            function closeLeaderboard() {
                leaderboardModal.classList.remove('active');
                // 如果是因为模态框打开而暂停的，不要自动恢复，让用户手动恢复
                // 但我们不自动恢复，保持当前暂停状态
            }

            // 点击背景关闭
            leaderboardModal.addEventListener('click', function(e) {
                if (e.target === leaderboardModal) {
                    closeLeaderboard();
                }
            });

            // ================================================================
            //  初始化
            // ================================================================
            function initGame() {
                snake = [
                    [9, 10],
                    [8, 10],
                    [7, 10]
                ];
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                gameOver = false;
                win = false;
                isGameRunning = false;
                isPaused = false;
                currentInterval = BASE_INTERVAL;

                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }

                spawnFood();
                updateScore();
                setStatus('▶ 方向键开始');
                pauseBtn.textContent = '⏸ 暂停';
                drawCanvas();
            }

            // ================================================================
            //  食物生成
            // ================================================================
            function spawnFood() {
                const totalCells = BOARD_SIZE * BOARD_SIZE;
                if (snake.length >= totalCells) {
                    win = true;
                    gameOver = true;
                    isGameRunning = false;
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                    setStatus('✨ 胜利！');
                    // 胜利时记录高分
                    trySaveHighScore(score);
                    drawCanvas();
                    return;
                }

                const snakeSet = new Set(snake.map(cell => `${cell[0]},${cell[1]}`));
                const free = [];
                for (let i = 0; i < BOARD_SIZE; i++) {
                    for (let j = 0; j < BOARD_SIZE; j++) {
                        if (!snakeSet.has(`${i},${j}`)) free.push([i, j]);
                    }
                }
                if (free.length === 0) {
                    win = true;
                    gameOver = true;
                    isGameRunning = false;
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                    setStatus('✨ 胜利！');
                    trySaveHighScore(score);
                    drawCanvas();
                    return;
                }
                const idx = Math.floor(Math.random() * free.length);
                const [fx, fy] = free[idx];
                food = { x: fx, y: fy };
            }

            // ================================================================
            //  尝试保存高分
            // ================================================================
            function trySaveHighScore(currentScore) {
                if (currentScore > 0) {
                    saveHighScore(currentScore);
                }
            }

            // ================================================================
            //  移动逻辑
            // ================================================================
            function moveSnake() {
                if (isPaused || gameOver || !isGameRunning) return false;

                const opposite = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
                if (nextDirection && opposite[nextDirection] !== direction) {
                    direction = nextDirection;
                }

                const head = snake[0];
                let newHeadX = head[0];
                let newHeadY = head[1];
                switch (direction) {
                    case 'right':
                        newHeadX++;
                        break;
                    case 'left':
                        newHeadX--;
                        break;
                    case 'up':
                        newHeadY--;
                        break;
                    case 'down':
                        newHeadY++;
                        break;
                    default:
                        return false;
                }

                const isEating = (newHeadX === food.x && newHeadY === food.y);
                let newSnake = [
                    [newHeadX, newHeadY],
                    ...snake
                ];
                if (!isEating) newSnake.pop();

                if (newHeadX < 0 || newHeadX >= BOARD_SIZE || newHeadY < 0 || newHeadY >= BOARD_SIZE) {
                    endGame('撞墙了');
                    return false;
                }
                const headStr = `${newHeadX},${newHeadY}`;
                for (let i = 1; i < newSnake.length; i++) {
                    if (`${newSnake[i][0]},${newSnake[i][1]}` === headStr) {
                        endGame('咬到自己');
                        return false;
                    }
                }

                snake = newSnake;

                if (isEating) {
                    score++;
                    updateScore();
                    adjustSpeed();
                    spawnFood();
                    if (win) return true;
                }

                if (snake.length === BOARD_SIZE * BOARD_SIZE) {
                    win = true;
                    gameOver = true;
                    isGameRunning = false;
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                    setStatus('✨ 胜利！');
                    trySaveHighScore(score);
                    drawCanvas();
                    return true;
                }

                drawCanvas();
                return true;
            }

            // ================================================================
            //  速度调整
            // ================================================================
            function adjustSpeed() {
                let newInterval = Math.max(MIN_INTERVAL, BASE_INTERVAL - score * SPEED_STEP);
                if (newInterval !== currentInterval) {
                    currentInterval = newInterval;
                    if (isGameRunning && !gameOver) {
                        if (gameLoopInterval) {
                            clearInterval(gameLoopInterval);
                            gameLoopInterval = null;
                        }
                        gameLoopInterval = setInterval(() => {
                            if (!gameOver && isGameRunning) moveSnake();
                        }, currentInterval);
                    }
                }
            }

            // ================================================================
            //  结束游戏
            // ================================================================
            function endGame(msg) {
                if (gameOver) return;
                gameOver = true;
                isGameRunning = false;
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                setStatus('✕ ' + msg);
                // 记录高分
                trySaveHighScore(score);
                drawCanvas();
            }

            // ================================================================
            //  UI 更新
            // ================================================================
            function updateScore() {
                scoreSpan.textContent = score;
            }

            function setStatus(text) {
                statusDiv.innerHTML = `<span class="highlight">${text}</span>`;
            }

            // ================================================================
            //  绘制
            // ================================================================
            function drawCanvas() {
                ctx.clearRect(0, 0, 500, 500);

                // 极淡网格
                ctx.strokeStyle = 'rgba(160, 140, 120, 0.08)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= BOARD_SIZE; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * CELL_SIZE, 0);
                    ctx.lineTo(i * CELL_SIZE, 500);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * CELL_SIZE);
                    ctx.lineTo(500, i * CELL_SIZE);
                    ctx.stroke();
                }

                // ---- 食物 ----
                const fp = 4;
                const fs = CELL_SIZE - fp * 2;
                const fx = food.x * CELL_SIZE + fp;
                const fy = food.y * CELL_SIZE + fp;
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#f5b832';
                ctx.fillRect(fx, fy, fs, fs);

                // ---- 蛇：头部深色，身体渐变为浅色 ----
                const headColor = '#2d5a2d';
                const tailColor = '#8bb88b';

                snake.forEach((seg, idx) => {
                    const [x, y] = seg;
                    const isHead = (idx === 0);
                    const pad = 2;
                    const sz = CELL_SIZE - pad * 2;
                    const px = x * CELL_SIZE + pad;
                    const py = y * CELL_SIZE + pad;

                    let color;
                    if (isHead) {
                        color = headColor;
                    } else {
                        const ratio = idx / (snake.length - 1);
                        const r1 = 45,
                            g1 = 90,
                            b1 = 45;
                        const r2 = 139,
                            g2 = 184,
                            b2 = 139;
                        const r = Math.round(r1 + (r2 - r1) * ratio);
                        const g = Math.round(g1 + (g2 - g1) * ratio);
                        const b = Math.round(b1 + (b2 - b1) * ratio);
                        color = `rgb(${r}, ${g}, ${b})`;
                    }

                    if (isHead) {
                        ctx.shadowColor = 'rgba(45, 90, 45, 0.30)';
                        ctx.shadowBlur = 14;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillStyle = color;
                    ctx.fillRect(px, py, sz, sz);
                    ctx.shadowBlur = 0;
                });

                // ---- 暂停遮罩 ----
                if (isPaused && !gameOver && isGameRunning) {
                    ctx.fillStyle = 'rgba(245, 239, 230, 0.60)';
                    ctx.fillRect(0, 0, 500, 500);
                    ctx.fillStyle = '#4a3d32';
                    ctx.font = 'bold 36px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(245, 239, 230, 0.6)';
                    ctx.shadowBlur = 20;
                    ctx.fillText('⏸ 暂停', 250, 250);
                    ctx.shadowBlur = 0;
                }

                // ---- 游戏结束遮罩 ----
                if (gameOver) {
                    ctx.fillStyle = 'rgba(245, 239, 230, 0.55)';
                    ctx.fillRect(0, 0, 500, 500);
                    ctx.fillStyle = '#4a3d32';
                    ctx.font = 'bold 30px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(245, 239, 230, 0.6)';
                    ctx.shadowBlur = 20;
                    ctx.fillText(win ? '✦ 胜利 ✦' : '✖ 结束', 250, 250);
                    ctx.shadowBlur = 0;
                }
            }

            // ================================================================
            //  游戏循环
            // ================================================================
            function startGameLoop() {
                if (gameLoopInterval) {
                    clearInterval(gameLoopInterval);
                    gameLoopInterval = null;
                }
                gameLoopInterval = setInterval(() => {
                    if (!gameOver && isGameRunning) moveSnake();
                }, currentInterval);
            }

            // ================================================================
            //  开始 / 重启
            // ================================================================
            function startGame() {
                if (gameOver) initGame();
                if (!isGameRunning && !gameOver) {
                    isGameRunning = true;
                    isPaused = false;
                    pauseBtn.textContent = '⏸ 暂停';
                    setStatus('▶ 游戏中');
                    if (gameLoopInterval) {
                        clearInterval(gameLoopInterval);
                        gameLoopInterval = null;
                    }
                    startGameLoop();
                    drawCanvas();
                }
            }

            function restartGame() {
                // 如果模态框开着，关掉
                if (leaderboardModal.classList.contains('active')) {
                    closeLeaderboard();
                }
                initGame();
                drawCanvas();
            }

            // ================================================================
            //  暂停切换
            // ================================================================
            function togglePause() {
                if (gameOver || !isGameRunning) return;
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? '▶ 继续' : '⏸ 暂停';
                setStatus(isPaused ? '⏸ 暂停' : '▶ 游戏中');
                drawCanvas();
            }

            // ================================================================
            //  键盘控制
            // ================================================================
            function handleKey(e) {
                const key = e.key;

                // 空格切换暂停
                if (key === ' ' || key === 'Space') {
                    e.preventDefault();
                    // 如果模态框开着，不处理暂停
                    if (leaderboardModal.classList.contains('active')) return;
                    if (!gameOver && isGameRunning) {
                        togglePause();
                    }
                    return;
                }

                if (key.startsWith('Arrow')) e.preventDefault();

                if (gameOver || !isGameRunning) {
                    if (key.startsWith('Arrow')) startGame();
                    else return;
                }

                let newDir = null;
                switch (key) {
                    case 'ArrowUp':
                        newDir = 'up';
                        break;
                    case 'ArrowDown':
                        newDir = 'down';
                        break;
                    case 'ArrowLeft':
                        newDir = 'left';
                        break;
                    case 'ArrowRight':
                        newDir = 'right';
                        break;
                    default:
                        return;
                }
                if (newDir) {
                    const opposite = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
                    if (opposite[newDir] !== direction) {
                        nextDirection = newDir;
                        triggerHaptic();
                    }
                }
            }

            // ================================================================
            //  十字键
            // ================================================================
            function setupDpad() {
                document.querySelectorAll('.dpad .touch-btn').forEach(btn => {
                    const handler = (e) => {
                        e.preventDefault();
                        const dir = btn.dataset.dir;
                        if (!dir) return;
                        triggerHaptic();
                        const map = { 'up': 'ArrowUp', 'down': 'ArrowDown', 'left': 'ArrowLeft', 'right': 'ArrowRight' };
                        handleKey(new KeyboardEvent('keydown', { key: map[dir] }));
                    };
                    btn.addEventListener('touchstart', handler, { passive: false });
                    btn.addEventListener('mousedown', handler);
                });
            }

            // ================================================================
            //  摇杆
            // ================================================================
            function setupJoystick() {
                let active = false;

                const getPos = (e) => {
                    const rect = joystickBase.getBoundingClientRect();
                    const cx = rect.left + rect.width / 2;
                    const cy = rect.top + rect.height / 2;
                    let clientX, clientY;
                    if (e.touches) {
                        const touch = e.touches[0];
                        clientX = touch.clientX;
                        clientY = touch.clientY;
                    } else {
                        clientX = e.clientX;
                        clientY = e.clientY;
                    }
                    const dx = clientX - cx;
                    const dy = clientY - cy;
                    const maxDist = rect.width / 2 - 20;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    let clampedDist = Math.min(dist, maxDist);
                    let angle = Math.atan2(dy, dx);
                    return { dx, dy, dist, clampedDist, angle, maxDist };
                };

                const updateJoystick = (e) => {
                    if (!active) return;
                    e.preventDefault();
                    const pos = getPos(e);
                    const { dx, dy, dist, clampedDist, angle, maxDist } = pos;
                    const ratio = clampedDist / maxDist;
                    const thumbX = ratio * dx;
                    const thumbY = ratio * dy;
                    joystickThumb.style.transform = `translate(calc(-50% + ${thumbX}px), calc(-50% + ${thumbY}px))`;

                    if (dist < 15) {
                        joystickDir = null;
                        return;
                    }
                    const deg = angle * 180 / Math.PI;
                    let dir = null;
                    if (deg > -45 && deg <= 45) dir = 'right';
                    else if (deg > 45 && deg <= 135) dir = 'down';
                    else if (deg > -135 && deg <= -45) dir = 'up';
                    else dir = 'left';
                    if (dir !== joystickDir) {
                        joystickDir = dir;
                        triggerHaptic();
                        const map = { 'up': 'ArrowUp', 'down': 'ArrowDown', 'left': 'ArrowLeft', 'right': 'ArrowRight' };
                        handleKey(new KeyboardEvent('keydown', { key: map[dir] }));
                    }
                };

                const startJoystick = (e) => {
                    e.preventDefault();
                    if (active) return;
                    active = true;
                    triggerHaptic();
                    joystickThumb.style.transform = 'translate(-50%, -50%)';
                    joystickDir = null;
                    updateJoystick(e);
                    window.addEventListener('touchmove', updateJoystick, { passive: false });
                    window.addEventListener('touchend', endJoystick, { passive: false });
                    window.addEventListener('touchcancel', endJoystick, { passive: false });
                    window.addEventListener('mousemove', updateJoystick);
                    window.addEventListener('mouseup', endJoystick);
                };

                const endJoystick = (e) => {
                    if (!active) return;
                    active = false;
                    joystickThumb.style.transform = 'translate(-50%, -50%)';
                    joystickDir = null;
                    window.removeEventListener('touchmove', updateJoystick);
                    window.removeEventListener('touchend', endJoystick);
                    window.removeEventListener('touchcancel', endJoystick);
                    window.removeEventListener('mousemove', updateJoystick);
                    window.removeEventListener('mouseup', endJoystick);
                };

                joystickBase.addEventListener('touchstart', startJoystick, { passive: false });
                joystickBase.addEventListener('mousedown', startJoystick);
            }

            // ================================================================
            //  模式切换
            // ================================================================
            function switchMode(mode) {
                currentMode = mode;
                if (mode === 'dpad') {
                    dpadContainer.style.display = 'flex';
                    joystickContainer.style.display = 'none';
                } else {
                    dpadContainer.style.display = 'none';
                    joystickContainer.style.display = 'flex';
                }
                modeBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
            }

            // ================================================================
            //  初始化控制
            // ================================================================
            function initControls() {
                setupDpad();
                setupJoystick();

                modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const mode = btn.dataset.mode;
                        if (mode !== currentMode) {
                            switchMode(mode);
                        }
                    });
                });

                switchMode('dpad');
            }

            // ================================================================
            //  启动
            // ================================================================
            function init() {
                initGame();

                // 事件绑定
                window.addEventListener('keydown', handleKey);
                document.getElementById('restartBtn').addEventListener('click', restartGame);
                pauseBtn.addEventListener('click', togglePause);

                // 高分榜按钮
                leaderboardBtn.addEventListener('click', function() {
                    if (leaderboardModal.classList.contains('active')) {
                        closeLeaderboard();
                    } else {
                        openLeaderboard();
                    }
                });
                modalCloseBtn.addEventListener('click', closeLeaderboard);

                // 点击背景关闭
                leaderboardModal.addEventListener('click', function(e) {
                    if (e.target === leaderboardModal) {
                        closeLeaderboard();
                    }
                });

                initControls();
                drawCanvas();
                setStatus('▶ 方向键开始');

                // 预热渲染一次高分榜（不打开）
                renderLeaderboard();
            }

            init();
        })();
    </script>
</body>
